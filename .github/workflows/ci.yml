name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: make lint test eval

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: make web-setup web-build
      - run: uv run --frozen --group browser playwright install --with-deps chromium
      - run: uv run --frozen --group browser python scripts/ui_smoke.py
